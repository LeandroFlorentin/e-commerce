services:
  postgres:
    image: postgres:13
    restart: always
    env_file:
      - ../env/db/postgres/.env.dev
    container_name: db_postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: cache
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
